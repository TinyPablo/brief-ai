<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Brief AI</title>

  <link href="/vendor/fonts.css" rel="stylesheet" />

  <link rel="stylesheet" href="/vendor/highlight.css" />
  <link rel="stylesheet" href="/vendor/katex.css" />

  <script src="/vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0d0c0a',
            panel: '#1a1712',
            panel2: '#221e17',
            edge: '#3a3226',
            muted: '#9c9286',
            accent: '#e6a84a',
            accent2: '#f0bd6e',
            accentInk: '#241a08',
            good: '#6cc48a',
            bad: '#dc5b45',
          },
          fontFamily: {
            sans: ['Space Grotesk', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['Space Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    html, body {
      background: #0d0c0a;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.014) 0px, transparent 1px, transparent 18px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.014) 0px, transparent 1px, transparent 18px),
        radial-gradient(900px 500px at 50% -10%, rgba(230,168,74,0.07), transparent 60%);
      background-attachment: fixed;
    }
    ::selection { background: rgba(230, 168, 74, 0.3); }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #322b20; border-radius: 6px; border: 2px solid #0d0c0a; }
    ::-webkit-scrollbar-thumb:hover { background: #453b2b; }

    .pin-input {
      caret-color: #e6a84a;
    }
    .pin-input:focus {
      border-color: #e6a84a;
      box-shadow: 0 0 0 3px rgba(230, 168, 74, 0.18);
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #f0bd6e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Command Deck HUD accents, reused across the header/composer/result panels */
    .glow { text-shadow: 0 0 14px rgba(230, 168, 74, 0.5); }

    .corner-panel { position: relative; }
    .corner-panel::before, .corner-panel::after {
      content: ''; position: absolute; width: 9px; height: 9px;
      border: 1.5px solid #e6a84a; opacity: 0.7; pointer-events: none;
    }
    .corner-panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .corner-panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    .gauge-track { height: 5px; background: #221e17; position: relative; overflow: hidden; }
    .gauge-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #6cc48a; transition: width 0.2s ease-out; }
    .gauge-fill.over { background: #dc5b45; }

    .fade-in { animation: fade 0.25s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .image-preview-trigger { cursor: pointer; border-radius: 4px; }
    .image-preview-trigger:focus-visible { outline: 2px solid #e6a84a; outline-offset: 3px; }
    .image-preview {
      position: fixed; inset: 0; margin: auto; padding: 0;
      width: 100vw; height: 100dvh; max-width: none; max-height: none;
      border: 0; color: #e8e2d6; background: rgba(13,12,10,.96);
    }
    .image-preview[open] { display: flex; flex-direction: column; }
    .image-preview::backdrop { background: rgba(0,0,0,.85); }
    .image-preview-toolbar, .image-preview-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 16px 24px; flex-shrink: 0;
      background: #1a1712; border-bottom: 1px solid #3a3226;
    }
    .image-preview-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .image-preview-name { font-size: 12px; color: #9c9286; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .image-preview-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .image-preview button { white-space: nowrap; min-height: 44px; min-width: 44px; padding: 8px 12px; border: 1px solid #3a3226; border-radius: 8px; font-size: 13px; }
    .image-preview button:hover:not(:disabled) { background: #322b20; border-color: #e6a84a; }
    .image-preview button:focus-visible { outline: 2px solid #e6a84a; outline-offset: 2px; }
    .image-preview button:disabled { opacity: .35; cursor: default; }
    .image-preview-viewport { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
    .image-preview-canvas { display: flex; align-items: center; justify-content: center; min-width: 100%; min-height: 100%; }
    .image-preview-canvas img { max-width: none; flex-shrink: 0; user-select: none; border-radius: 3px; }
    .image-preview-footer { border-top: 1px solid #3a3226; border-bottom: 0; }
    .image-preview-footer span { font-size: 12px; color: #9c9286; text-align: center; }
    @media (max-width: 640px) {
      .image-preview-toolbar { flex-wrap: wrap; padding: 12px; }
      .image-preview-title { width: 100%; }
      .image-preview-actions { width: 100%; justify-content: space-between; }
      .image-preview-footer { padding: 10px; gap: 8px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
      .image-preview-footer span { font-size: 10px; }
      .image-preview button { padding: 8px; }
    }

    .deck-button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 14px; border: 1px solid #3a3226; border-radius: 4px; font-size: 13px; cursor: pointer; }
    .deck-button:hover:not(:disabled) { background: #383328; }
    .deck-button.primary { background: #e6a84a; border-color: #e6a84a; color: #211b11; }
    .deck-button.primary:hover:not(:disabled) { background: #ead2a8; }
    .deck-button.danger { background: #913d36; color: white; }
    .deck-button:disabled { opacity: .4; cursor: default; }
    button:focus-visible, a:focus-visible { outline: 2px solid #e6a84a; outline-offset: 3px; }
    .deck-input { background: #0d0c0a; border: 1px solid #3a3226; border-radius: 4px; padding: 10px 12px; font-size: 13px; }
    .deck-modal { inset: 0; height: fit-content; margin: auto; padding: 20px; width: min(100%, 520px); max-height: 95dvh; border: none; background: transparent; color: #eee8dd; }
    .deck-modal::backdrop { background: #000b; backdrop-filter: blur(5px); }
    .deck-modal > section { padding: 28px; border: 1px solid #3a3226; border-radius: 6px; background: #1a1712; }
    .sharing-option { display: flex; align-items: flex-start; gap: 12px; font-size: 15px; cursor: pointer; }
    .sharing-option input { margin-top: 4px; width: 18px; height: 18px; accent-color: #e6a84a; }
    .sharing-option small { display: block; color: #9c9286; font-size: 12px; line-height: 1.6; margin-top: 3px; }
    .history-meta { flex-wrap: wrap; gap: 4px 12px; }
    .history-meta > span { white-space: nowrap; }
    @media (max-width: 640px) { .history-meta > .ml-auto { margin-left: 0; } }
    .swipe-row { position: relative; overflow: hidden; }
    .swipe-content { position: relative; transition: transform .2s ease; touch-action: pan-y; }
    .swipe-delete { position: absolute; right: 0; top: 0; bottom: 0; width: 88px; color: white; background: #913d36; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { .swipe-content, .fade-in { transition: none !important; animation: none !important; } }
    @media (max-width: 640px) { .deck-modal { padding: 12px; } .deck-modal > section { padding: 20px; } }

    .deck-heading { font-family: 'Space Mono', monospace; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; }
    .settings-section { padding: 20px; border: 1px solid #3a3226; background: #1a1712; }
    .settings-section h2 { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #f0bd6e; margin-bottom: 16px; }
    .settings-section p { font-size: 12px; line-height: 1.6; color: #9c9286; }
    .settings-toggle { appearance: none; width: 36px; height: 20px; border: 1px solid #3a3226; border-radius: 10px; background: #0d0c0a; position: relative; flex-shrink: 0; cursor: pointer; }
    .settings-toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #9c9286; transition: transform .15s; }
    .settings-toggle:checked { background: #e6a84a; border-color: #e6a84a; }
    .settings-toggle:checked::after { background: #241a08; transform: translateX(16px); }
    .settings-toggle:focus-visible { outline: 2px solid #e6a84a; outline-offset: 3px; }
    .settings-section label { font-size: 13px; }

    /* Rendered markdown */
    .md { line-height: 1.7; color: #e6e6ec; font-size: 0.95rem; word-wrap: break-word; }
    .md > *:first-child { margin-top: 0; }
    .md > *:last-child { margin-bottom: 0; }
    .md h1, .md h2, .md h3, .md h4 { font-weight: 600; line-height: 1.3; margin: 1.3em 0 0.5em; }
    .md h1 { font-size: 1.5rem; } .md h2 { font-size: 1.25rem; } .md h3 { font-size: 1.1rem; }
    .md p { margin: 0.7em 0; }
    .md ul, .md ol { margin: 0.7em 0; padding-left: 1.4em; }
    .md ul { list-style: disc; } .md ol { list-style: decimal; }
    .md li { margin: 0.25em 0; }
    .md a { color: #f0bd6e; text-decoration: underline; text-underline-offset: 2px; }
    .md strong { color: #f2f2f6; font-weight: 600; }
    .md code { font-family: 'Space Mono', monospace; font-size: 0.85em; background: #221e17; padding: 0.15em 0.4em; border-radius: 0.35em; }
    .md pre { background: #131110 !important; border: 1px solid #3a3226; border-radius: 0.6rem; padding: 1rem; overflow: auto; margin: 0.85em 0; }
    .md pre code { background: none !important; padding: 0; font-size: 0.83rem; line-height: 1.55; }
    .md blockquote { border-left: 3px solid #e6a84a; padding-left: 1em; color: #ab9f8f; margin: 0.7em 0; }
    .md table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 0.9rem; }
    .md th, .md td { border: 1px solid #3a3226; padding: 0.45em 0.75em; text-align: left; }
    .md th { background: #1a1712; }
    .md hr { border: none; border-top: 1px solid #3a3226; margin: 1.2em 0; }
    .md .katex { font-size: 1.05em; }
    .md .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.2em 0; margin: 0.8em 0; }

    .md pre { position: relative; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      font-size: 11px; line-height: 1; padding: 4px 8px;
      color: #9c9286; background: #1a1712; border: 1px solid #3a3226;
      border-radius: 6px; cursor: pointer; opacity: 0;
      transition: opacity 0.15s, color 0.15s, border-color 0.15s;
    }
    .md pre:hover .copy-btn, .copy-btn:focus { opacity: 1; }
    .copy-btn:hover { color: #fff; border-color: #453b2b; }


    body { zoom: 1.2; overscroll-behavior-x: contain; }
    .conversation-workspace { max-width: 1100px; margin: auto; position: relative; }
    .conversation-stage { max-width: 620px; margin: auto; overflow-x: clip; touch-action: pan-y; }
    .conversation-navigation { position: sticky; top: 56px; z-index: 5; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,620px) minmax(0,1fr); align-items: center; min-height: 44px; margin-bottom: 16px; }
    .conversation-navigation button { color: #9c9286; font-family: 'Space Mono', monospace; font-size: 12px; }
    .conversation-navigation button:hover { color: #e6a84a; }
    .conversation-navigation > div:first-child { position: absolute; top: 62px; left: 0; width: calc((100% - 620px)/2 - 20px); }
    .conversation-navigation > div:last-child { position: absolute; top: 62px; right: 0; width: calc((100% - 620px)/2 - 20px); }
    .conversation-neighbor { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 44px; width: 100%; background: #0d0c0a; }
    .conversation-neighbor.next { margin-left: auto; justify-content: flex-end; text-align: right; }
    .conversation-actions { grid-column: 2; display: flex; justify-content: flex-end; gap: 16px; align-items: center; background: #0d0c0a; }
    .conversation-actions button { min-height: 44px; }
    .conversation-actions button[aria-label="Close conversation"] { min-width: 44px; }
    .conversation-transition-layer { position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
    .conversation-outgoing { position: absolute; overflow: hidden; background: #0d0c0a; }
    .new-reply-button { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #221e17; color: #e6a84a; border: 1px solid #3a3226; padding: 10px 16px; z-index: 10; font-size: 12px; }
    [data-conversation-view][hidden] { display: none !important; }
    @media (max-width: 1149px) {
      .conversation-navigation { max-width: 620px; margin-left: auto; margin-right: auto; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px 16px; background: #0d0c0a; }
      .conversation-actions { grid-column: 1 / -1; grid-row: 1; }
      .conversation-navigation > div:first-child, .conversation-navigation > div:last-child { position: static; width: auto; }
      .conversation-navigation > div:first-child { grid-column: 1; grid-row: 2; }
      .conversation-navigation > div:last-child { grid-column: 2; grid-row: 2; }
    }

    .conversation-navigation { min-height: 0; margin-bottom: 0; }
    .conversation-navigation > div:first-child, .conversation-navigation > div:last-child { top: 16px; }
    .conversation-navigation:not(:has(button)) { display: none; }
    .header-new-conversation { margin-left: auto; }
    .header-new-conversation, .header-close-conversation { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #9c9286; font-family: 'Space Mono', monospace; font-size: 24px; }
    .header-close-conversation { font-size: 22px; }
    .header-new-conversation:hover, .header-close-conversation:hover { color: #e6a84a; }
    .header-close-conversation ~ button.hidden.sm\:block { margin-left: 8px; }
    [data-conversation-view] { transform-origin: 50% 50%; }
    @media (max-width: 1149px) {
      .conversation-navigation { margin-bottom: 16px; gap: 0 16px; }
      .conversation-navigation > div:first-child, .conversation-navigation > div:last-child { grid-row: 1; position: static; }
    }
    .message-action { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; color: #9c9286; border-radius: 4px; flex-shrink: 0; }
    .message-action:hover:not(:disabled) { color: #e8e2d6; background: #ffffff08; }
    .message-action:disabled { opacity: .4; cursor: default; }
    .attachment-picker { display: inline-flex; align-items: center; gap: 6px; min-width: 34px; min-height: 36px; color: #9c9286; position: relative; font: 11px 'Space Mono', monospace; }
    .attachment-picker:hover:not(:disabled) { color: #e8e2d6; }
    .attachment-picker:disabled { opacity: .4; }
    .attachment-details { display: none; position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 30; background: #221e17; border: 1px solid #3a3226; padding: 10px 12px; width: 210px; text-align: left; line-height: 1.8; box-shadow: 0 10px 30px #0006; border-radius: 4px; }
    .attachment-picker.show-details .attachment-details { display: block; }
    .model-select { appearance: auto; background: #221e17; border: 1px solid #3a3226; border-radius: 4px; padding: 6px 8px; font: 11px 'Space Mono', monospace; color: #e8e2d6; max-width: 100%; min-width: 0; cursor: pointer; }
    .model-select:hover:not(:disabled) { border-color: #e6a84a80; }
    .model-select:disabled { opacity: .5; cursor: default; }
    .regenerate-popover .model-select { width: 100%; }
    .regenerate-popover { position: fixed; z-index: 110; width: min(300px, calc(100vw / 1.2 - 24px)); max-height: calc(100dvh / 1.2 - 24px); overflow-y: auto; padding: 16px; border: 1px solid #645039; border-radius: 5px; background: #211c15; box-shadow: 0 20px 70px #0009; color: #e8e2d6; }
    .corner-panel:has(> .message-editor) { border-color: #e6a84a80; }
    .message-editor { border-top: 1px solid #e6a84a30; }
    @media (max-width: 640px) { .message-actions { gap: 0; } .message-action { width: 32px; } .message-toolbar > time { font-size: 10px; } }
    .message-action.delete-confirm, .message-action.delete-confirm:hover:not(:disabled) { color: #dc5b45; background: #dc5b4518; box-shadow: inset 0 0 0 1px #dc5b4540; }
    .delete-action-icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; animation: delete-action-reveal .14s ease-out; }
    @keyframes delete-action-reveal { from { opacity: .35; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .delete-action-icon { animation: none; } }
  </style>
</head>
<body class="font-sans text-[#e6e6ec] antialiased">

  <script src="/vendor/react.js" crossorigin></script>
  <script src="/vendor/react-dom.js" crossorigin></script>
  <script src="/vendor/babel.js"></script>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/vendor/highlight.js"></script>
  <script src="/vendor/katex.js"></script>
  <script src="/vendor/marked-katex.js"></script>

  <script src="/conversation-sessions.js"></script>
  <script src="/conversation-navigation.js"></script>
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
