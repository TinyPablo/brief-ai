<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Brief AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0d0c0a',
            panel: '#1a1712',
            panel2: '#221e17',
            edge: '#3a3226',
            muted: '#9c9286',
            accent: '#e6a84a',
            accent2: '#f0bd6e',
            accentInk: '#241a08',
            good: '#6cc48a',
            bad: '#dc5b45',
          },
          fontFamily: {
            sans: ['Space Grotesk', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['Space Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    html, body {
      background: #0d0c0a;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.014) 0px, transparent 1px, transparent 18px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.014) 0px, transparent 1px, transparent 18px),
        radial-gradient(900px 500px at 50% -10%, rgba(230,168,74,0.07), transparent 60%);
      background-attachment: fixed;
    }
    ::selection { background: rgba(230, 168, 74, 0.3); }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #322b20; border-radius: 6px; border: 2px solid #0d0c0a; }
    ::-webkit-scrollbar-thumb:hover { background: #453b2b; }

    .pin-input {
      caret-color: #e6a84a;
    }
    .pin-input:focus {
      border-color: #e6a84a;
      box-shadow: 0 0 0 3px rgba(230, 168, 74, 0.18);
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #f0bd6e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Command Deck HUD accents, reused across the header/composer/result panels */
    .glow { text-shadow: 0 0 14px rgba(230, 168, 74, 0.5); }

    .corner-panel { position: relative; }
    .corner-panel::before, .corner-panel::after {
      content: ''; position: absolute; width: 9px; height: 9px;
      border: 1.5px solid #e6a84a; opacity: 0.7; pointer-events: none;
    }
    .corner-panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .corner-panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    .gauge-track { height: 5px; background: #221e17; position: relative; overflow: hidden; }
    .gauge-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #6cc48a; transition: width 0.2s ease-out; }
    .gauge-fill.over { background: #dc5b45; }

    .fade-in { animation: fade 0.25s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .image-preview-trigger { cursor: pointer; border-radius: 4px; }
    .image-preview-trigger:focus-visible { outline: 2px solid #e6a84a; outline-offset: 3px; }
    .image-preview {
      position: fixed; inset: 0; margin: auto; padding: 0;
      width: 100vw; height: 100dvh; max-width: none; max-height: none;
      border: 0; color: #e8e2d6; background: rgba(13,12,10,.96);
    }
    .image-preview[open] { display: flex; flex-direction: column; }
    .image-preview::backdrop { background: rgba(0,0,0,.85); }
    .image-preview-toolbar, .image-preview-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 16px 24px; flex-shrink: 0;
      background: #1a1712; border-bottom: 1px solid #3a3226;
    }
    .image-preview-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .image-preview-name { font-size: 12px; color: #9c9286; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .image-preview-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .image-preview button { white-space: nowrap; min-height: 44px; min-width: 44px; padding: 8px 12px; border: 1px solid #3a3226; border-radius: 8px; font-size: 13px; }
    .image-preview button:hover:not(:disabled) { background: #322b20; border-color: #e6a84a; }
    .image-preview button:focus-visible { outline: 2px solid #e6a84a; outline-offset: 2px; }
    .image-preview button:disabled { opacity: .35; cursor: default; }
    .image-preview-viewport { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
    .image-preview-canvas { display: flex; align-items: center; justify-content: center; min-width: 100%; min-height: 100%; }
    .image-preview-canvas img { max-width: none; flex-shrink: 0; user-select: none; border-radius: 3px; }
    .image-preview-footer { border-top: 1px solid #3a3226; border-bottom: 0; }
    .image-preview-footer span { font-size: 12px; color: #9c9286; text-align: center; }
    @media (max-width: 640px) {
      .image-preview-toolbar { flex-wrap: wrap; padding: 12px; }
      .image-preview-title { width: 100%; }
      .image-preview-actions { width: 100%; justify-content: space-between; }
      .image-preview-footer { padding: 10px; gap: 8px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
      .image-preview-footer span { font-size: 10px; }
      .image-preview button { padding: 8px; }
    }

    /* Rendered markdown */
    .md { line-height: 1.7; color: #e6e6ec; font-size: 0.95rem; word-wrap: break-word; }
    .md > *:first-child { margin-top: 0; }
    .md > *:last-child { margin-bottom: 0; }
    .md h1, .md h2, .md h3, .md h4 { font-weight: 600; line-height: 1.3; margin: 1.3em 0 0.5em; }
    .md h1 { font-size: 1.5rem; } .md h2 { font-size: 1.25rem; } .md h3 { font-size: 1.1rem; }
    .md p { margin: 0.7em 0; }
    .md ul, .md ol { margin: 0.7em 0; padding-left: 1.4em; }
    .md ul { list-style: disc; } .md ol { list-style: decimal; }
    .md li { margin: 0.25em 0; }
    .md a { color: #f0bd6e; text-decoration: underline; text-underline-offset: 2px; }
    .md strong { color: #f2f2f6; font-weight: 600; }
    .md code { font-family: 'Space Mono', monospace; font-size: 0.85em; background: #221e17; padding: 0.15em 0.4em; border-radius: 0.35em; }
    .md pre { background: #131110 !important; border: 1px solid #3a3226; border-radius: 0.6rem; padding: 1rem; overflow: auto; margin: 0.85em 0; }
    .md pre code { background: none !important; padding: 0; font-size: 0.83rem; line-height: 1.55; }
    .md blockquote { border-left: 3px solid #e6a84a; padding-left: 1em; color: #ab9f8f; margin: 0.7em 0; }
    .md table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 0.9rem; }
    .md th, .md td { border: 1px solid #3a3226; padding: 0.45em 0.75em; text-align: left; }
    .md th { background: #1a1712; }
    .md hr { border: none; border-top: 1px solid #3a3226; margin: 1.2em 0; }
    .md .katex { font-size: 1.05em; }
    .md .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.2em 0; margin: 0.8em 0; }

    .md pre { position: relative; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      font-size: 11px; line-height: 1; padding: 4px 8px;
      color: #9c9286; background: #1a1712; border: 1px solid #3a3226;
      border-radius: 6px; cursor: pointer; opacity: 0;
      transition: opacity 0.15s, color 0.15s, border-color 0.15s;
    }
    .md pre:hover .copy-btn, .copy-btn:focus { opacity: 1; }
    .copy-btn:hover { color: #fff; border-color: #453b2b; }
  </style>
</head>
<body class="font-sans text-[#e6e6ec] antialiased">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.4/lib/index.umd.js"></script>

  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
